<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Mobile Scanner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/2.4.3/signalr.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
            padding: 10px;
            background: #f5f5f5;
        }

        #scanner-container {
            width: 100%;
            height: 300px;
            margin-bottom: 10px;
        }

        #result {
            margin: 10px 0;
            padding: 10px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            word-break: break-all;
        }

        #log {
            margin: 10px 0;
            padding: 10px;
            background: #e0e0e0;
            height: 150px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 12px;
        }

        input, button {
            margin: 5px 0;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

            button:hover {
                background-color: #45a049;
            }

        .status-connected {
            background-color: #d4edda;
            color: #155724;
            padding: 8px;
            border-radius: 4px;
            margin: 10px 0;
        }

        .status-disconnected {
            background-color: #f8d7da;
            color: #721c24;
            padding: 8px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Mobile Scanner</h1>

    <div id="status" class="status-disconnected">⚫ Not connected</div>

    <div>
        <label for="serverUrl">Server URL:</label>
        <input type="text" id="serverUrl" placeholder="http://192.168.100.134:8082/signalr" />
    </div>
    <div>
        <label for="deviceId">Device ID:</label>
        <input type="text" id="deviceId" placeholder="Scan QR Code or enter manually" />
    </div>
    <button id="connectBtn">Connect to PC</button>

    <div id="scanner-container"></div>

    <div id="result">Last scanned: None</div>
    <div id="log"></div>

    <script>
        let html5QrCode = null;
        let connection = null;
        let proxy = null;
        let currentDeviceId = null;
        let currentServerUrl = null;

        // Initialize scanner
        function initScanner() {
            if (html5QrCode === null) {
                html5QrCode = new Html5Qrcode("scanner-container");
            }
        }

        // Start QR scanner
        function startScanner() {
            initScanner();

            html5QrCode.start(
                { facingMode: "environment" },
                { qrbox: { width: 250, height: 250 } },
                (qrCodeMessage) => {
                    logMessage(`QR scanned: ${qrCodeMessage.substring(0, 100)}`);

                    // Try to parse URL
                    try {
                        const url = new URL(qrCodeMessage);
                        const deviceIdParam = url.searchParams.get("DeviceID");
                        const serverUrlParam = url.searchParams.get("ServerURL");

                        if (deviceIdParam && serverUrlParam) {
                            document.getElementById("deviceId").value = deviceIdParam;
                            document.getElementById("serverUrl").value = serverUrlParam;
                            connectToSignalR(deviceIdParam, serverUrlParam);
                        } else {
                            // If QR contains just a URL with room
                            window.open(qrCodeMessage, '_blank');
                        }
                    } catch (e) {
                        // Not a URL, treat as barcode
                        logMessage(`Scanned barcode: ${qrCodeMessage}`);
                        if (connection && connection.state === $.signalR.connectionState.connected) {
                            sendToServer(qrCodeMessage);
                        } else {
                            logMessage("Not connected to server. Please connect first.");
                        }
                    }

                    // Stop scanner after successful scan
                    html5QrCode.stop().catch(err => {
                        logMessage("Error stopping scanner: " + err);
                    });

                    // Restart scanner after 2 seconds
                    setTimeout(() => {
                        html5QrCode.start(
                            { facingMode: "environment" },
                            { qrbox: { width: 250, height: 250 } },
                            arguments.callee
                        ).catch(err => logMessage("Scanner restart error: " + err));
                    }, 2000);
                }
            ).catch(err => logMessage(`QR Scanner Error: ${err}`));
        }

        // Connect to SignalR server (old SignalR style)
        function connectToSignalR(deviceId, serverUrl) {
            currentDeviceId = deviceId;
            currentServerUrl = serverUrl;

            try {
                // Ensure serverUrl ends correctly
                let hubUrl = serverUrl;
                if (!hubUrl.endsWith("/signalr")) {
                    hubUrl = hubUrl.replace(/\/$/, '');
                }

                logMessage(`Connecting to ${hubUrl}...`);

                if (connection) {
                    connection.stop();
                }

                // Create connection for old SignalR
                connection = $.hubConnection(hubUrl, { useDefaultPath: false });
                proxy = connection.createHubProxy("ScanHub");

                // Register events
                proxy.on("receiveBarcode", (barcode) => {
                    document.getElementById("result").textContent = `Last scanned: ${barcode}`;
                    logMessage(`Received: ${barcode}`);
                });

                proxy.on("logMessage", (message) => {
                    logMessage(message);
                });

                proxy.on("registered", (registeredDeviceId) => {
                    logMessage(`Registered as: ${registeredDeviceId}`);
                    updateStatus(true);
                });

                // Start connection
                connection.start()
                    .done(() => {
                        logMessage(`Connected to server`);
                        proxy.invoke("RegisterMobile", deviceId)
                            .done(() => {
                                logMessage(`Registration sent for ${deviceId}`);
                            })
                            .fail((err) => {
                                logMessage(`Registration failed: ${err}`);
                            });
                    })
                    .fail((err) => {
                        logMessage(`Connection error: ${err}`);
                        updateStatus(false);
                        // Retry after 5 seconds
                        setTimeout(() => connectToSignalR(deviceId, serverUrl), 5000);
                    });

            } catch (err) {
                logMessage(`Error: ${err}`);
                updateStatus(false);
            }
        }

        // Send scanned barcode to server
        function sendToServer(barcode) {
            if (!connection || connection.state !== $.signalR.connectionState.connected) {
                logMessage("Not connected to server");
                return;
            }

            if (!currentDeviceId) {
                logMessage("No device ID");
                return;
            }

            logMessage(`Sending barcode: ${barcode}`);
            proxy.invoke("SendBarcode", currentDeviceId, barcode)
                .done(() => {
                    logMessage(`Sent successfully`);
                    document.getElementById("result").textContent = `Last scanned: ${barcode}`;
                })
                .fail((err) => {
                    logMessage(`Send failed: ${err}`);
                });
        }

        // Update connection status UI
        function updateStatus(connected) {
            const statusDiv = document.getElementById("status");
            if (connected) {
                statusDiv.className = "status-connected";
                statusDiv.innerHTML = "✅ Connected to PC";
            } else {
                statusDiv.className = "status-disconnected";
                statusDiv.innerHTML = "⚫ Not connected";
            }
        }

        // Log messages
        function logMessage(message) {
            const logDiv = document.getElementById("log");
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        // Manual connect button
        document.getElementById("connectBtn").addEventListener("click", () => {
            const deviceId = document.getElementById("deviceId").value;
            const serverUrl = document.getElementById("serverUrl").value;
            if (deviceId && serverUrl) {
                connectToSignalR(deviceId, serverUrl);
            } else {
                alert("Please enter Device ID and Server URL!");
            }
        });

        // Start scanner on page load
        window.onload = function () {
            initScanner();
            startScanner();
            logMessage("Scanner ready. Scan QR code from PC or enter connection details manually.");
        };
    </script>
</body>
</html>
